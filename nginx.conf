server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Keep redirects relative so they do not leak the container port behind a published one
    absolute_redirect off;

    # Off in the stock nginx image; text/html is always compressed once enabled
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml application/manifest+json text/plain;

    # Astro fingerprints its bundled assets under /_astro
    location /_astro/ {
        include security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Spanish moved from /es/ to the root
    location ~ ^/es/?$ {
        return 301 /;
    }

    location / {
        include security-headers.conf;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include security-headers.conf;
    }
}
