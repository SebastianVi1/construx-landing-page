server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Keep redirects relative so they do not leak the container port behind a published one
    absolute_redirect off;

    # Astro fingerprints its bundled assets under /_astro
    location /_astro/ {
        include security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        include security-headers.conf;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include security-headers.conf;
    }
}
